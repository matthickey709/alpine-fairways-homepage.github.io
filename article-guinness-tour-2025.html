    <h1>Inaugural St. John's Guinness Tour</h1>
    <span class="date">Published on November 29, 2025 by Matthew Hickey</span>

    <p>The inspiration for a Guinness rating app came from a plan to drive around St. John's in the search of the best pint of Guinness. For the first iteration of this, the tour visited 8 bars, rating pints along the way.</p>

    <h2>The Podium Finishers</h2>

    <div class="podium-box">
      <p><span class="podium-rank">1. Peter Easton Pub</span><br>
      The clear winner of the evening. The Peter Easton pub delivered fantastic Guinness. The temperature was perfect—cold enough to be refreshing, and the glasses were served chilled. It was the first time in the establishment for many folks on the tour, but it left a fantastic first impression. The live music session was the cherry on top.</p>

      <p><span class="podium-rank">2. Big Ben's</span><br>
      A 50+ year-old suburban pub that lived up to its reputation. Big Ben's was cozy, and already decorated for Christmas. The pints were cold, smooth, and tasty, and many of the group was able to sit together at a larger table in the back. This was an early top in the tour, and was immediately a contender.</p>

      <p><span class="podium-rank">3. Bally Haly Country Club</span><br>
      Third place goes to Bally Haly Country Club, where the night began with a meal. This establishment was on the tour as many of the individuals on the tour are members at the club, and were aware of their good reputation for pouring pints. It was a great start to the night, and many had 2 pints at this location. </p>
    </div>

    <p>The group looks forward to continuing this tour in a future iteration, and trying more pubs as well. Proper Drop will continue to be used throughout the year as anyone can rate a pint at any time, but this was the tour that started the idea.</p>
